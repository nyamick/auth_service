<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card">

    <h1>Добро пожаловать, {{ session.username }}!</h1>

    <div class="info">

        <p><strong>Email:</strong> {{ session.email }}</p>

        <p><strong>Дата регистрации:</strong> {{ session.created_at }}</p>

        <p><strong>Роль:</strong> Пользователь</p>

    </div>

    <a href="/logout">
        <button>Выйти</button>
    </a>

</div>

</body>
</html>
