<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="card">

        <h1>Регистрация</h1>

        <p class="subtitle">Создайте новый аккаунт</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="message">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST">

            <input type="text" name="username" placeholder="Имя пользователя" required minlength="3" maxlength="20">

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Пароль" required minlength="6">

            <input type="password" name="confirm" placeholder="Подтвердите пароль" required>

            <div class="captcha-box">
                <span>{{ captcha }} = ?</span>
            </div>

            <input type="number" name="captcha" placeholder="Ответ" required>

            <button type="submit">Зарегистрироваться</button>

        </form>

        <p class="bottom-text">
            Уже есть аккаунт?
            <a href="/login">Войти</a>
        </p>

    </div>

</body>

</html>
